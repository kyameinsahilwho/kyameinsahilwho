  </radialGradient>
  <linearGradient id="inkFill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1b1612"/><stop offset="0.5" stop-color="#1b1612"/><stop offset="1" stop-color="#1b1612"/>
  </linearGradient>
  <linearGradient id="ruleL" x1="0" x2="1"><stop offset="0" stop-color="#9c8d79" stop-opacity="0"/><stop offset="1" stop-color="#9c8d79"/></linearGradient>
  <linearGradient id="ruleR" x1="0" x2="1"><stop offset="0" stop-color="#9c8d79"/><stop offset="1" stop-color="#9c8d79" stop-opacity="0"/></linearGradient>
  <clipPath id="frame"><rect width="900" height="110" rx="6"/></clipPath>
  
</defs>
